[project]
name = "diabetes-risk-app"
version = "0.1.0"
description = "Diabetes risk app backend foundation"
readme = "README.md"
authors = [
    { name = "giftyhealthtech", email = "sekinatoyelami@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[project.scripts]
diabetes-risk-app = "diabetes_risk_app:main"

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["backend/tests"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
