services:
  - type: web
    name: diabetes-risk-app-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_NAME
        value: diabetes-risk-app
      - key: APP_VERSION
        value: 0.1.0
      - key: ENVIRONMENT
        value: production
      - key: MODEL_API_URL
        value: https://diabetes-risk-prediction-tmkn.onrender.com
      - key: MODEL_API_TIMEOUT
        value: "120.0"
      - key: CORS_ORIGINS
        value: https://diabetes-risk-app-z8ke.onrender.com

  - type: web
    name: diabetes-risk-app-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        value: https://diabetes-risk-app-api.onrender.com
